server {
    listen 80;
    server_name ai.12fz.com;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name ai.12fz.com;

    ssl_certificate /root/.acme.sh/ai.12fz.com_ecc/fullchain.cer;
    ssl_certificate_key /root/.acme.sh/ai.12fz.com_ecc/ai.12fz.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location = /analytics {
        proxy_pass http://127.0.0.1:3009;
    }
    location /api/v1/track { proxy_pass http://127.0.0.1:3009; }
    location /api/v1/analytics { proxy_pass http://127.0.0.1:3009; }
    location /api/v1/orders { proxy_pass http://127.0.0.1:8099; }

    location /ws2 {
        rewrite ^/ws2(.*) /ws break;
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection upgrade;
        proxy_buffering off;
    }

    location /ws {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
    }

    location /chat/ {
        rewrite ^/chat/(.*) /$1 break;
        proxy_pass http://127.0.0.1:8081;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8081;
    }

    location /v1/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass https://127.0.0.1;
        proxy_ssl_verify off;
        proxy_set_header Host dev.12fz.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-API-Key $http_x_api_key;
    }

    access_log /var/log/nginx/ai.12fz.com.log;
    error_log /var/log/nginx/ai.12fz.com.error.log;
}
